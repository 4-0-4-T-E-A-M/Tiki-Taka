spring:
  application:
    name: tikitaka
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: io.github.team404.tikitaka.global.kafka.event
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
        provider:
          google:
            user-name-attribute: sub

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY:3600000}
  refresh-token-expiry: ${JWT_REFRESH_TOKEN_EXPIRY:604800000}

tikitaka:
  cache:
    # 이슈 #57: 공연 상세는 오픈 전후로 거의 안 바뀌어 TTL을 길게(15분) 가져가 캐시 히트율을 우선하고,
    # 수정/삭제는 PerformanceService가 evictDetail로 즉시 무효화해 최신성을 보완한다.
    performance-detail-ttl-ms: ${PERFORMANCE_DETAIL_CACHE_TTL_MS:900000}

performance:
  open:
    # 오픈 시각이 지난 회차를 SCHEDULED → OPEN으로 전환하는 스케줄러 주기
    poll-interval-ms: 1000
    # 오픈 시점에 대기열에서 즉시 입장 허용할 인원. 점진적 증가는 7주차 안정성 이슈로 미룸
    initial-admit-count: 100

queue:
  sse:
    # 대기열 순번 재조회 주기 — 커넥션 전체를 순회하는 단일 스케줄 태스크의 간격
    poll-interval-ms: 1000
    # SSE 커넥션 타임아웃(ms). 끊기면 클라이언트가 표준 SSE 재연결을 시도하고,
    # 재연결 시에도 Redis ZSET 순번은 그대로 남아있어 유실 없이 최초 1회 push로 복구된다.
    timeout-ms: 300000
