spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  data:
    redis:
      host: localhost
      port: 6379
  elasticsearch:
    # 실제 ES 연결은 Testcontainers IT에서 @DynamicPropertySource로 오버라이드한다.
    # 그 외 테스트는 ES를 쓰지 않지만, 미설정 시 프로퍼티 플레이스홀더가 풀리지 않아 기본값만 둔다.
    uris: http://localhost:9200
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope:
              - email
              - profile
        provider:
          google:
            user-name-attribute: sub

jwt:
  secret: dGlraXRha2EtdGVzdC1zZWNyZXQta2V5LWZvci1qd3QtMjU2Yml0cy1kZXY=
  access-token-expiry: 3600000
  refresh-token-expiry: 604800000

tikitaka:
  cache:
    performance-detail-ttl-ms: 900000
